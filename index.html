<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeoVent — Neonatal Ventilator Simulator</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #020617;
      margin: 0;
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #root {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React and ReactDOM from CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Alias for lucide-react UMD which looks for global.react (lowercase) -->
  <script>window.react = React;</script>

  <!-- Lucide React icons -->
  <script src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>

  <!-- Global references for the pre-transpiled app -->
  <script>
    var useState = React.useState;
    var useMemo = React.useMemo;
    var useEffect = React.useEffect;
    var useRef = React.useRef;
    var Activity = window.LucideReact.Activity;
    var Wind = window.LucideReact.Wind;
    var Waves = window.LucideReact.Waves;
    var Zap = window.LucideReact.Zap;
    var AlertTriangle = window.LucideReact.AlertTriangle;
    var TrendingUp = window.LucideReact.TrendingUp;
    var TrendingDown = window.LucideReact.TrendingDown;
    var Minus = window.LucideReact.Minus;
    var Heart = window.LucideReact.Heart;
    var Droplet = window.LucideReact.Droplet;
    var Info = window.LucideReact.Info;
  </script>

  <!-- Pre-transpiled app (no Babel needed) -->
  <script src="neovent-sim.js?v=2"></script>

  <!-- Render -->
  <script>
    var root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(NeoVentSim));
  </script>
</body>
</html>
